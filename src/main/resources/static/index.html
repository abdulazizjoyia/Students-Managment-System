<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 0;

        }


        .container {

            width: 90%;

            max-width: 1100px;

            margin: 40px auto;

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

        }


        .form-container {

            background: white;

            padding: 25px;

            border-radius: 10px;

            margin-bottom: 30px;

        }


        .form-container h2 {

            margin-top: 0;

        }


        input {

            width: 100%;

            padding: 12px;

            margin: 8px 0 15px 0;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 5px;

        }


        button {

            padding: 12px 20px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            background: #007bff;

            color: white;

            margin-right: 5px;

        }


        button:hover {

            background: #0056b3;

        }


        .cancel-btn {

            background: #6c757d;

        }


        .cancel-btn:hover {

            background: #545b62;

        }


        .delete-btn {

            background: #dc3545;

        }


        .delete-btn:hover {

            background: #a71d2a;

        }


        .edit-btn {

            background: #28a745;

        }


        .edit-btn:hover {

            background: #1e7e34;

        }


        .table-container {

            background: white;

            padding: 25px;

            border-radius: 10px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th,
        td {

            padding: 12px;

            border-bottom: 1px solid #ddd;

            text-align: left;

        }


        th {

            background: #007bff;

            color: white;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>

        Student Management System

    </h1>


    <!-- ============================= -->
    <!-- Student Form -->
    <!-- ============================= -->

    <div class="form-container">


        <h2 id="formTitle">

            Add Student

        </h2>


        <form id="studentForm">


            <label>

                Name

            </label>


            <input

                    type="text"

                    id="name"

                    placeholder="Enter student name"

                    required

            >


            <label>

                Email

            </label>


            <input

                    type="email"

                    id="email"

                    placeholder="Enter student email"

                    required

            >


            <label>

                Phone

            </label>


            <input

                    type="text"

                    id="phone"

                    placeholder="Enter phone number"

            >


            <label>

                Course

            </label>


            <input

                    type="text"

                    id="course"

                    placeholder="Enter course"

            >


            <button

                    type="submit"

                    id="submitButton">

                Add Student

            </button>


            <button

                    type="button"

                    id="cancelButton"

                    class="cancel-btn"

                    style="display: none;">

                Cancel

            </button>


        </form>


    </div>



    <!-- ============================= -->
    <!-- Students Table -->
    <!-- ============================= -->


    <div class="table-container">


        <h2>

            Students List

        </h2>


        <table>


            <thead>


            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Course</th>

                <th>Action</th>

            </tr>


            </thead>


            <tbody id="studentTableBody">


            </tbody>


        </table>


    </div>


</div>



<script>


    // ==========================================
    // API URL
    // ==========================================


    const API_URL = "/api/students";


    // ==========================================
    // Get HTML Elements
    // ==========================================


    const studentForm =

        document.getElementById("studentForm");


    const formTitle =

        document.getElementById("formTitle");


    const submitButton =

        document.getElementById("submitButton");


    const cancelButton =

        document.getElementById("cancelButton");


    const tableBody =

        document.getElementById("studentTableBody");


    // ==========================================
    // Current Editing Student ID
    // ==========================================


    let editingStudentId = null;



    // ==========================================
    // Load All Students
    // ==========================================


    function loadStudents() {


        fetch(API_URL)


            .then(response => {


                if (!response.ok) {

                    throw new Error(
                        "Failed to load students"
                    );

                }


                return response.json();

            })


            .then(students => {


                tableBody.innerHTML = "";


                students.forEach(student => {


                    const row = `

                        <tr>

                            <td>
                                ${student.id}
                            </td>


                            <td>
                                ${student.name}
                            </td>


                            <td>
                                ${student.email}
                            </td>


                            <td>
                                ${student.phone || ""}
                            </td>


                            <td>
                                ${student.course || ""}
                            </td>


                            <td>


                                <button

                                    class="edit-btn"

                                    onclick="editStudent(${student.id})">

                                    Edit

                                </button>


                                <button

                                    class="delete-btn"

                                    onclick="deleteStudent(${student.id})">

                                    Delete

                                </button>


                            </td>


                        </tr>

                    `;


                    tableBody.innerHTML += row;


                });

            })


            .catch(error => {


                console.error(
                    "Error loading students:",
                    error
                );


            });

    }



    // ==========================================
    // Add / Update Student
    // ==========================================


    studentForm.addEventListener(

        "submit",

        function(event) {


            event.preventDefault();


            // Get form values


            const student = {


                name:

                document
                    .getElementById("name")
                    .value,


                email:

                document
                    .getElementById("email")
                    .value,


                phone:

                document
                    .getElementById("phone")
                    .value,


                course:

                document
                    .getElementById("course")
                    .value

            };



            // ==================================
            // ADD STUDENT
            // ==================================


            if (editingStudentId === null) {


                fetch(API_URL, {


                    method: "POST",


                    headers: {

                        "Content-Type":
                            "application/json"

                    },


                    body:
                        JSON.stringify(student)


                })


                    .then(response => {


                        if (!response.ok) {

                            throw new Error(
                                "Failed to add student"
                            );

                        }


                        return response.json();

                    })


                    .then(data => {


                        alert(
                            "Student Added Successfully!"
                        );


                        resetForm();


                        loadStudents();


                    })


                    .catch(error => {


                        console.error(
                            "Error adding student:",
                            error
                        );


                        alert(
                            "Error adding student!"
                        );

                    });


            }


                // ==================================
                // UPDATE STUDENT
            // ==================================


            else {


                fetch(

                    `${API_URL}/${editingStudentId}`,

                    {


                        method: "PUT",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        body:
                            JSON.stringify(student)

                    }

                )


                    .then(response => {


                        if (!response.ok) {

                            throw new Error(
                                "Failed to update student"
                            );

                        }


                        return response.json();

                    })


                    .then(data => {


                        alert(
                            "Student Updated Successfully!"
                        );


                        resetForm();


                        loadStudents();


                    })


                    .catch(error => {


                        console.error(
                            "Error updating student:",
                            error
                        );


                        alert(
                            "Error updating student!"
                        );

                    });

            }

        }

    );



    // ==========================================
    // Edit Student
    // ==========================================


    function editStudent(id) {


        fetch(`${API_URL}/${id}`)


            .then(response => {


                if (!response.ok) {

                    throw new Error(
                        "Student not found"
                    );

                }


                return response.json();

            })


            .then(student => {


                // Put student data into form


                document
                    .getElementById("name")
                    .value = student.name;


                document
                    .getElementById("email")
                    .value = student.email;


                document
                    .getElementById("phone")
                    .value = student.phone || "";


                document
                    .getElementById("course")
                    .value = student.course || "";



                // Save ID


                editingStudentId = student.id;



                // Change form title


                formTitle.innerText =
                    "Update Student";



                // Change button


                submitButton.innerText =
                    "Update Student";



                // Show cancel button


                cancelButton.style.display =
                    "inline-block";



                // Scroll to form


                window.scrollTo({

                    top: 0,

                    behavior: "smooth"

                });

            })


            .catch(error => {


                console.error(
                    "Error getting student:",
                    error
                );


                alert(
                    "Error loading student!"
                );

            });

    }



    // ==========================================
    // Delete Student
    // ==========================================


    function deleteStudent(id) {


        if (

            !confirm(
                "Are you sure you want to delete this student?"
            )

        ) {

            return;

        }



        fetch(

            `${API_URL}/${id}`,

            {

                method: "DELETE"

            }

        )


            .then(response => {


                if (!response.ok) {

                    throw new Error(
                        "Failed to delete student"
                    );

                }


                return response.text();

            })


            .then(message => {


                alert(
                    "Student Deleted Successfully!"
                );


                loadStudents();


            })


            .catch(error => {


                console.error(
                    "Error deleting student:",
                    error
                );


                alert(
                    "Error deleting student!"
                );

            });

    }



    // ==========================================
    // Cancel Update
    // ==========================================


    cancelButton.addEventListener(

        "click",

        function() {


            resetForm();

        }

    );



    // ==========================================
    // Reset Form
    // ==========================================


    function resetForm() {


        studentForm.reset();


        editingStudentId = null;


        formTitle.innerText =
            "Add Student";


        submitButton.innerText =
            "Add Student";


        cancelButton.style.display =
            "none";

    }



    // ==========================================
    // Load Students When Page Opens
    // ==========================================


    loadStudents();


</script>


</body>

</html>
